server:
  port: 8081
  servlet:
    context-path: /api
spring:
  application:
    name: ai-code-helper
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DB}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  thymeleaf:
    mode: HTML5
langchain4j:
  community:
    dashscope:
      chat-model:
        api-key: ${MODEL_API_KEY} #千问密钥
        model-name: ${MODEL_NAME}
      embedding-model:
        model-name: text-embedding-v4
        api-key: ${MODEL_API_KEY}
      streaming-chat-model:
        model-name: ${MODEL_NAME}
        api-key: ${MODEL_API_KEY}
bigmodel:
  api-key: ${BIGMODEL_API_KEY} #智谱mcp密钥